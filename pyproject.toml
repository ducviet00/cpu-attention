[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-attention"
version = "0.1.0"
description = "Paged CPU attention kernels written in Mojo, with flash-attn's API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]
license = { file = "LICENSE" }

[project.optional-dependencies]
# The Mojo compiler, from the PyPI wheel: uv is the only tool needed.
build = ["mojo==1.2.0"]
test = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["cpu_attention*"]
namespaces = false

[tool.setuptools.package-data]
cpu_attention = ["_C.so", "_C_*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
