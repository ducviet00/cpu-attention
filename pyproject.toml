[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-attention"
version = "0.1.0"
description = "Paged CPU attention kernels written in Mojo, with flash-attn's API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]
license = { file = "LICENSE" }

[project.optional-dependencies]
test = ["transformers"]

[tool.setuptools.packages.find]
include = ["cpu_attention*"]
namespaces = false

[tool.setuptools.package-data]
cpu_attention = ["_C.so"]
